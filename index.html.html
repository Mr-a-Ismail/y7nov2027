<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ورقة عمل اللغة العربية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tx:#111;--hd:#c8f0cc;--bl:#bfe3f5;--rd:#b00000;--nv:#1f3864;--ln:#9a9a9a;--pn:#f3f8fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181c20;--tx:#eee;--hd:#2d5a38;--bl:#24475c;--rd:#ff8f8f;--nv:#9fb8e8;--ln:#666;--pn:#232a30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181c20;--tx:#eee;--hd:#2d5a38;--bl:#24475c;--rd:#ff8f8f;--nv:#9fb8e8;--ln:#666;--pn:#232a30;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:20px/1.9 Amiri,"Traditional Arabic",serif}
main{max-width:760px;margin:auto;padding:12px 16px 48px}
h2{background:var(--hd);margin:28px 0 8px;padding:6px 14px;font-size:21px}
h3{color:var(--nv);font-size:19px;margin:18px 0 4px}
.q{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--ln);padding:10px 4px;cursor:pointer}
.q:hover,.q:focus-visible{background:var(--pn);outline:2px solid var(--nv)}
.m{color:var(--nv);font-size:16px}.hint{display:block;color:var(--nv);font-size:16px}
.mid{text-align:center;padding:50px 0}
input{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);padding:8px 12px;width:min(320px,100%);box-sizing:border-box}
button.go{font:inherit;background:var(--nv);color:#fff;border:0;padding:8px 24px;margin:8px;cursor:pointer}
.mo{font-size:44px;background:none;border:2px solid var(--ln);border-radius:50%;width:72px;height:72px;margin:6px;cursor:pointer}.mo:hover,.mo:focus-visible{border-color:var(--nv);background:var(--pn)}
.note{background:var(--pn);border-inline-start:4px solid var(--rd);padding:8px 12px;font-size:17px}
dialog{width:min(620px,94vw);background:var(--bg);color:var(--tx);border:2px solid var(--nv);padding:16px 20px}
dialog::backdrop{background:#0008}
.ans{background:var(--bl);padding:10px 14px;margin:10px 0}.err{color:var(--rd)}
</style></head><body><main>

 if(!n||!u){er.textContent="لم نجد هذا الاسم. اكتب اسمك كما يعرفه معلّمك.";return}
